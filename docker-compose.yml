# IFF Cargo: database, API and web app.
#
#   docker compose up -d --build            # build and start everything
#   docker compose run --rm api npm run db:seed   # first time only: demo data + carriers
#   docker compose logs -f api              # API log (dev emails / OTP codes print here)
#
# Secrets come from backend/.env (never copied into an image). Values set under
# `environment:` below override the same names in that file.

services:
  mongo:
    image: mongo:6.0
    # Single-node replica set: booking and quote creation use multi-document transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is up.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/iffcargo?replicaSet=rs0
      PORT: "4000"
      # Where QuickBooks sends people back after connecting (the web app's public address).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # The API address as the browser sees it. Baked in at build time: rebuild after changing.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mongo-data:
